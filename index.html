<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>С днюхой Максимбек!</title>
    <style>

        @media (max-width: 1445px) {
            body {
                height: 1000px;
            }

            video {
                position: absolute;
                top: 35%;
                left: 40%;
                z-index: 5;
                width: 30%;
                height: 30%;
            }

            #photo1 {
                position: absolute;
                bottom: 0;
                left: 0;
                z-index: 3;
                width: 25%;
            }

            #photo2 {
                position: absolute;
                top: 0;
                left: 42%;
                width: 30%;
                z-index: 6;
            }

            #photo3 {
                position: absolute;
                bottom: 0;
                left: 45%;
                z-index: 3;
            }

            #photo4 {
                position: absolute;
                top: 0;
                right: 0;
                width: 25%;
                z-index: 1;
            }

            #photo5 {
                position: absolute;
                top: 0;
                left: 0;
                z-index: 2;
            }

            #photo6 {
                position: absolute;
                bottom: 0;
                right: 0;
                z-index: 2;
                width: 50%;
            }

            #photo7 {
                position: absolute;
                top: 0;
                left: 10%;
                z-index: 1;
                height: 100%;
            }
        }

        @media (max-width: 450px) {
            body {
                height: 500px
            }
            #photo5 {
                z-index: 0}
             #photo2 {
                top: 20%;
            }
        }

    </style>
</head>
<body>
<header>

</header>
<main>
    <video controls>
        <source src="pal_max.mp4" type="video/mp4">
    </video>
    <img src="paladebek/images/palade1.svg" alt="максим" id="photo1">
    <img src="paladebek/images/palade2.svg" alt="максим" id="photo2">
    <img src="paladebek/images/palade3.svg" alt="максим" id="photo3">
    <img src="paladebek/images/palade4.svg" alt="максим" id="photo4">
    <img src="paladebek/images/palade5.svg" alt="максим" id="photo5">
    <img src="paladebek/images/palade6.svg" alt="максим" id="photo6">
    <img src="paladebek/images/palade7.svg" alt="максим" id="photo7">
</main>
</body>
</html>
